name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Literal colors, off-step spacing, and literal fonts or corner radii fail here; exceptions are in xaml-design-allowlist.txt.
      - name: XAML design check
        uses: ./.github/actions/xaml-design-check

      - name: Choose version
        id: version
        shell: pwsh
        run: |
          $release = 'false'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
            $release = 'true'
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main') {
            # Every push to main releases the version in Directory.Build.props and tags that commit.
            $version = (Select-String -Path Directory.Build.props -Pattern '<Version[^>]*>([^<]+)</Version>').Matches[0].Groups[1].Value
            if (-not $version) { throw 'Directory.Build.props has no Version.' }
            git ls-remote --exit-code --tags origin "refs/tags/v$version" | Out-Null
            if ($LASTEXITCODE -eq 0) {
              throw "v$version is already tagged. Bump <Version> in Directory.Build.props with every change to main."
            }
            $global:LASTEXITCODE = 0
            $release = 'true'
          } else {
            $version = "1.0.0-ci.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build WpfFoundation.sln -c Release -p:ContinuousIntegrationBuild=true -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test WpfFoundation.sln -c Release --no-build

      - name: Pack
        # Both packages share the version, so one tag publishes them together.
        shell: pwsh
        run: |
          foreach ($project in 'src/WpfFoundation/WpfFoundation.csproj', 'src/WpfFoundation.Notifications/WpfFoundation.Notifications.csproj') {
            dotnet pack $project -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o out/packages
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish Gallery
        shell: pwsh
        run: |
          dotnet publish src/WpfFoundation.Gallery/WpfFoundation.Gallery.csproj -c Release --no-self-contained -p:ContinuousIntegrationBuild=true -p:Version=${{ steps.version.outputs.version }} -o out/gallery
          Compress-Archive -Path out/gallery/* -DestinationPath "out/WpfFoundation.Gallery-${{ steps.version.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: out/packages/*

      - uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: out/WpfFoundation.Gallery-*.zip

  release:
    if: needs.build.outputs.release == 'true'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      # NuGet.org trusted publishing exchanges this workflow's OIDC token for a short-lived API key, so no secret is stored.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: Sign in to NuGet.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: gbolotin

      - name: Push to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        # dotnet nuget push does not expand a forward-slash wildcard on Windows, so push each package by its full path.
        # The matching .snupkg next to each package is pushed with it.
        run: |
          foreach ($package in Get-ChildItem out/packages -Filter *.nupkg) {
            dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Create GitHub release with the Gallery
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        # On a push to main this also creates the tag on the pushed commit.
        run: |
          $options = @('--repo', $env:GITHUB_REPOSITORY, '--title', $env:TAG, '--target', $env:GITHUB_SHA, '--generate-notes')
          if ($env:TAG.Contains('-')) {
            $options += '--prerelease'
          }
          gh release create $env:TAG (Get-ChildItem out/gallery/*.zip).FullName @options
